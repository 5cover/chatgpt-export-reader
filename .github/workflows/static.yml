name: Deploy usage dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:all
      - run: pnpm lint
      - run: pnpm test:lint
      - run: pnpm --filter @stemmatic/core test
      - run: pnpm --filter stemmatic test
      - name: Verify dashboard interactions and accessibility
        run: |
          dashboard_browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$dashboard_browser" ]; then
            echo "An installed Chromium is required; browser downloads are intentionally disabled."
            exit 1
          fi
          BROWSER_PATH="$dashboard_browser" pnpm --filter @stemmatic/dashboard test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
